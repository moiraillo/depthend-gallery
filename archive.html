<style>
  :root {
    --cream: #ffffff;
    --warm-white: #ffffff;
    --charcoal: #1a1a18;
    --mid: #6b6860;
    --accent: #b8935a;
    --light-line: rgba(26,26,24,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--warm-white);
    color: var(--charcoal);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 48px;
    background: rgba(255,255,255,0.98);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--light-line);
  }
  .nav-logo img { height: 28px; display: block; }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a {
    font-size: 0.72rem; letter-spacing: 0.1em; color: var(--mid);
    text-decoration: none; font-weight: 400;
    transition: color 0.3s;
  }
  .nav-links a:hover { color: var(--accent); }

  /* HERO */
  .hero {
    display: grid; grid-template-columns: 1fr 1fr;
    padding-top: 62px;
    overflow: hidden;
    align-items: center;
  }
  .hero-left {
    display: flex; flex-direction: column; justify-content: center;
    padding: 80px 64px 80px 80px;
    position: relative;
  }
  .hero-left::before {
    content: '';
    position: absolute; top: 20%; left: 40px;
    width: 1px; height: 200px;
    background: linear-gradient(to bottom, transparent, var(--accent), transparent);
  }
  .hero-eyebrow {
    font-size: 0.65rem; letter-spacing: 0.35em; color: var(--accent);
    text-transform: uppercase; margin-bottom: 28px; font-weight: 400;
    opacity: 0; animation: fadeUp 1s 0.2s forwards;
  }
  .hero-title {
    font-size: clamp(2.4rem, 4vw, 4rem);
    font-weight: 700; line-height: 1.2;
    letter-spacing: -0.02em;
    opacity: 0; animation: fadeUp 1s 0.4s forwards;
  }
  .hero-title em { font-style: normal; color: var(--accent); }
  .hero-sub {
    margin-top: 28px;
    font-size: 0.88rem; line-height: 1.9; color: var(--mid);
    max-width: 400px; font-weight: 300;
    opacity: 0; animation: fadeUp 1s 0.6s forwards;
  }
  .hero-sub2 {
    margin-top: 12px;
    font-size: 0.85rem; line-height: 1.9; color: var(--mid);
    max-width: 400px; font-weight: 300;
    opacity: 0; animation: fadeUp 1s 0.7s forwards;
  }
  .hero-cta {
    display: flex; gap: 16px; margin-top: 48px;
    opacity: 0; animation: fadeUp 1s 0.8s forwards;
  }
  .btn-primary {
    padding: 14px 32px;
    background: var(--charcoal); color: var(--cream);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.75rem; letter-spacing: 0.1em;
    text-decoration: none; border: none; cursor: pointer;
    transition: background 0.3s, transform 0.2s; display: inline-block; font-weight: 400;
  }
  .btn-primary:hover { background: var(--accent); transform: translateY(-2px); }
  .btn-secondary {
    padding: 14px 32px;
    background: transparent; color: var(--charcoal);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.75rem; letter-spacing: 0.1em;
    text-decoration: none; border: 1px solid var(--charcoal); cursor: pointer;
    transition: all 0.3s; display: inline-block; font-weight: 400;
  }
  .btn-secondary:hover { background: var(--charcoal); color: var(--cream); transform: translateY(-2px); }

  /* HERO SLIDER */
  .hero-right {
    position: relative; overflow: hidden;
    opacity: 0; animation: fadeIn 1.2s 0.3s forwards;
    aspect-ratio: 4 / 3;
    align-self: center;
  }
  .slider-track {
    display: flex; height: 100%;
    transition: transform 0.8s cubic-bezier(0.77,0,0.175,1);
  }
  .slide {
    min-width: 100%; height: 100%;
    flex-shrink: 0;
  }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slider-dots {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.5); cursor: pointer;
    transition: background 0.3s, transform 0.3s;
  }
  .dot.active { background: #fff; transform: scale(1.3); }
  .slider-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.15); border: none; cursor: pointer;
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 1.2rem; z-index: 10;
    transition: background 0.3s; backdrop-filter: blur(4px);
  }
  .slider-arrow:hover { background: rgba(255,255,255,0.3); }
  .slider-arrow.prev { left: 12px; }
  .slider-arrow.next { right: 12px; }



  /* SECTIONS */
  section { padding: 100px 80px; }
  .section-tag {
    font-size: 0.6rem; letter-spacing: 0.4em; color: var(--accent);
    text-transform: uppercase; margin-bottom: 16px; font-weight: 500;
  }
  .section-title {
    font-size: clamp(2rem, 3vw, 3rem);
    font-weight: 700; line-height: 1.2; margin-bottom: 40px;
  }
  .section-line { width: 48px; height: 1px; background: var(--accent); margin-bottom: 40px; }

  /* GALLERY ROOMS */
  #rooms { background: #ffffff; padding: 100px 0; }
  .rooms-header { padding: 0 80px 60px; }
  .rooms-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .room-card {
    position: relative; overflow: hidden; height: 640px; cursor: pointer;
  }
  .room-card:hover .room-overlay { opacity: 1; }
  .room-card:hover .room-img-inner { transform: scale(1.04); }
  .room-img-inner {
    width: 100%; height: 100%;
    transition: transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94);
  }
  .room-img-inner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .room-overlay {
    position: absolute; inset: 0;
    background: rgba(26,26,24,0.72);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 48px; opacity: 0; transition: opacity 0.4s;
  }
  .room-tag { font-size: 0.6rem; letter-spacing: 0.35em; color: var(--accent); text-transform: uppercase; margin-bottom: 12px; font-weight: 500; }
  .room-name { font-size: 2.2rem; font-weight: 700; color: var(--cream); line-height: 1.1; margin-bottom: 16px; }
  .room-desc { font-size: 0.82rem; line-height: 1.8; color: rgba(245,240,232,0.8); margin-bottom: 28px; font-weight: 300; }
  .room-link {
    font-size: 0.68rem; letter-spacing: 0.25em; color: var(--accent);
    text-decoration: none; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px; transition: gap 0.3s; font-weight: 500;
  }
  .room-link:hover { gap: 14px; }
  .room-label {
    position: absolute; bottom: 32px; left: 48px;
    pointer-events: none; transition: opacity 0.4s;
  }
  .room-card:hover .room-label { opacity: 0; }
  .room-label-num { font-size: 5rem; font-weight: 700; color: rgba(26,26,24,0.08); line-height: 1; }
  .room-label-name { font-size: 0.75rem; letter-spacing: 0.15em; color: var(--mid); text-transform: uppercase; font-weight: 400; }

  /* DETAIL */
  .detail-section { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }
  .detail-section.reverse { direction: rtl; }
  .detail-section.reverse > * { direction: ltr; }
  .detail-img { position: relative; aspect-ratio: 4/3; overflow: hidden; }
  .detail-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-img::after {
    content: '';
    position: absolute; bottom: -20px; right: -20px;
    width: 80px; height: 80px;
    border: 1px solid var(--accent);
    pointer-events: none;
  }
  .detail-content { padding-top: 20px; }

  /* PRICING */
  .pricing-table { width: 100%; border-collapse: collapse; margin: 32px 0; }
  .pricing-table tr { border-bottom: 1px solid var(--light-line); }
  .pricing-table tr:first-child { border-top: 1px solid var(--light-line); }
  .pricing-table td { padding: 14px 0; font-size: 0.82rem; color: var(--mid); vertical-align: top; }
  .pricing-table td:first-child { color: var(--charcoal); font-weight: 400; width: 45%; padding-right: 16px; }
  .price-highlight { color: var(--accent) !important; font-weight: 500 !important; }

  /* AMENITIES */
  .amenity-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; margin-top: 32px; }
  .amenity-item {
    padding: 16px 0; border-bottom: 1px solid var(--light-line);
    display: flex; align-items: center; gap: 12px; font-size: 0.8rem; color: var(--mid); font-weight: 300;
  }
  .amenity-item::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  /* PROCEDURE */
  .procedure-steps { display: flex; flex-direction: column; gap: 0; margin-top: 32px; }
  .step { display: flex; gap: 28px; padding: 22px 0; border-bottom: 1px solid var(--light-line); align-items: flex-start; }
  .step-num { font-size: 1.8rem; font-weight: 700; color: var(--accent); line-height: 1; flex-shrink: 0; width: 32px; text-align: right; }
  .step-text { font-size: 0.82rem; color: var(--mid); line-height: 1.7; padding-top: 6px; font-weight: 300; }

  /* INFO CARDS */
  .info-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--light-line); margin-top: 60px; border: 1px solid var(--light-line); }
  .info-card { background: var(--warm-white); padding: 36px 32px; }
  .info-card h4 { font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 12px; font-weight: 500; }
  .info-card p { font-size: 0.8rem; line-height: 1.8; color: var(--mid); font-weight: 300; }
  .info-card a { color: var(--accent); text-decoration: none; }

  /* LOCATION */
  #location { background: var(--charcoal); color: var(--cream); }
  #location .section-title { color: var(--cream); }
  #location .section-tag { color: var(--accent); }
  .location-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; margin-top: 20px; }
  .location-item { display: flex; flex-direction: column; padding: 28px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .location-item:first-child { border-top: 1px solid rgba(255,255,255,0.1); }
  .location-item-label { font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; font-weight: 500; }
  .location-item-value { font-size: 0.88rem; line-height: 1.7; color: rgba(245,240,232,0.85); font-weight: 300; }
  .map-box {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; color: rgba(255,255,255,0.3); font-size: 0.7rem; letter-spacing: 0.2em; min-height: 360px;
  }

  /* CONTACT */
  .contact-strip {
    background: var(--accent); padding: 60px 80px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .contact-strip h3 { font-size: 2rem; font-weight: 700; color: var(--cream); line-height: 1.3; }
  .contact-links { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .contact-link { font-size: 0.78rem; letter-spacing: 0.1em; color: var(--cream); text-decoration: none; opacity: 0.9; transition: opacity 0.2s; font-weight: 400; }
  .contact-link:hover { opacity: 1; }

  /* FOOTER */
  footer {
    background: var(--charcoal); color: rgba(245,240,232,0.4);
    padding: 32px 80px; display: flex; align-items: center; justify-content: space-between;
    font-size: 0.68rem; letter-spacing: 0.1em;
  }
  .footer-logo img { height: 20px; opacity: 0.7; display: block; }

  /* CAL BTN */
  .cal-btn {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 24px;
    font-size: 0.7rem; letter-spacing: 0.18em; color: var(--accent);
    text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 3px;
    transition: opacity 0.2s; font-weight: 400;
  }
  .cal-btn:hover { opacity: 0.7; }

  /* ANIMATIONS */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .reveal { opacity: 0; transform: translateY(32px); transition: opacity 0.8s, transform 0.8s; }
  .reveal.visible { opacity: 1; transform: none; }

  /* MOBILE */
  @media (max-width: 900px) {
    .hero-left::before { display: none; }
    nav { padding: 12px 20px 10px; flex-direction: column; align-items: center; gap: 10px; }
    .nav-links { gap: 16px; flex-wrap: wrap; justify-content: center; }
    .nav-links a { font-size: 0.65rem; }
    section { padding: 60px 20px; }
    [style*="grid-template-columns:1fr 1fr"] { grid-template-columns: 1fr !important; gap: 40px !important; }
    div[style*="display:grid"] { grid-template-columns: 1fr !important; gap: 36px !important; }
    .hero { grid-template-columns: 1fr; }
    .hero-left { padding: 50px 24px; }
    .hero-right { aspect-ratio: 16 / 9 !important; height: auto; }
    .rooms-header { padding: 0 20px 40px; }
    .rooms-grid { grid-template-columns: 1fr; }
    .room-card { height: 400px; }
    .detail-section, .detail-section.reverse { grid-template-columns: 1fr; gap: 36px; direction: ltr; }
    .info-cards { grid-template-columns: 1fr; }
    .location-grid { grid-template-columns: 1fr; gap: 36px; }
    .contact-strip { flex-direction: column; gap: 24px; align-items: flex-start; padding: 40px 20px; }
    footer { flex-direction: column; gap: 12px; padding: 24px 20px; }
    .amenity-grid { grid-template-columns: 1fr; }
  }

  .h1-slide { min-width: 100%; height: 100%; flex-shrink: 0; }
  .h1-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .h1-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,0.3); cursor: pointer; transition: background 0.3s; }
  .h1-dot-active { background: #b8935a; }

<script>
  let current = 0;
  const total = 9;
  const track = document.getElementById('sliderTrack');
  const dotsContainer = document.getElementById('sliderDots');
  let autoTimer;

  // Create dots
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => goTo(i);
    dotsContainer.appendChild(d);
  }

  function goTo(n) {
    current = (n + total) % total;
    track.style.transform = `translateX(-${current * 100}%)`;
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
    resetTimer();
  }

  function changeSlide(dir) { goTo(current + dir); }

  function resetTimer() {
    clearInterval(autoTimer);
    autoTimer = setInterval(() => goTo(current + 1), 4000);
  }

  resetTimer();

  // Scroll reveal
  const reveals = document.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  reveals.forEach(r => observer.observe(r));

  // Hall1 slider
  let h1Current = 0;
  const h1Total = 7;
  const h1Track = document.getElementById('h1Track');
  let h1Timer;

  function h1GoTo(n) {
    h1Current = (n + h1Total) % h1Total;
    h1Track.style.transform = 'translateX(-' + (h1Current * 100) + '%)';
    document.querySelectorAll('.h1-dot').forEach((d, i) => {
      d.style.background = i === h1Current ? '#b8935a' : 'rgba(0,0,0,0.3)';
    });
    clearInterval(h1Timer);
    h1Timer = setInterval(() => h1GoTo(h1Current + 1), 4500);
  }

  function h1ChangeSlide(dir) { h1GoTo(h1Current + dir); }

  h1Timer = setInterval(() => h1GoTo(h1Current + 1), 4500);

  // Hall2 slider
  let h2Current = 0;
  const h2Total = 13;
  const h2Track = document.getElementById('h2Track');
  let h2Timer;

  function h2GoTo(n) {
    h2Current = (n + h2Total) % h2Total;
    h2Track.style.transform = 'translateX(-' + (h2Current * 100) + '%)';
    document.querySelectorAll('.h2-dot').forEach((d, i) => {
      d.style.background = i === h2Current ? '#b8935a' : 'rgba(0,0,0,0.3)';
    });
    clearInterval(h2Timer);
    h2Timer = setInterval(() => h2GoTo(h2Current + 1), 4500);
  }

  function h2ChangeSlide(dir) { h2GoTo(h2Current + dir); }

  h2Timer = setInterval(() => h2GoTo(h2Current + 1), 4500);
</script>
